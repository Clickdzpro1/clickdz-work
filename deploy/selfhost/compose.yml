name: clickdz-work

# ClickDz Work self-host stack (VPS / any Docker host).
# Same service contract as the upstream AFFiNE selfhost compose, pointed at
# the ClickDz Work image. Fill .env from .env.template first (no secrets in
# this file, ever).

services:
  server:
    image: ghcr.io/clickdzpro1/clickdz-work:${CLICKDZ_REVISION:-stable}
    container_name: clickdz_work_server
    ports:
      - '${PORT:-3010}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration_job:
        condition: service_completed_successfully
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config
    env_file: .env
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-clickdzwork}
      - AFFINE_INDEXER_ENABLED=false
    restart: unless-stopped

  migration_job:
    image: ghcr.io/clickdzpro1/clickdz-work:${CLICKDZ_REVISION:-stable}
    container_name: clickdz_work_migration
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    env_file: .env
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-clickdzwork}
      - AFFINE_INDEXER_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis
    container_name: clickdz_work_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'health_check']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: clickdz_work_postgres
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-clickdzwork}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE:-clickdzwork}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
