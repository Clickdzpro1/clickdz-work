# ZOOM+ (white-labeled La Suite Meet) frontend nginx config — PROXY variant.
#
# Purpose: make the SPA effectively single-origin so that:
#   1. GET /api/v1.0/config/  returns real JSON (not the SPA index.html), which
#      unblocks the app's config query and stops the infinite "Loading…".
#   2. The OIDC session legs (authenticate -> idp -> callback) land first-party
#      on the FRONTEND origin, so the session cookie is set first-party and the
#      SPA's /api/v1.0/users/me carries it.
#
# The app lives in an <iframe> on https://work.clickdz.ai, so every proxied
# response must NOT carry X-Frame-Options (the Django backend sends DENY).
#
# Design A (Railway private networking, upstream-faithful): proxy_pass to the
# backend's private domain over Railway's internal network. mozilla-django-oidc
# builds redirect_uri via request.build_absolute_uri() -> it follows the Host we
# forward here (the frontend host), so the callback stays first-party.
#
# Railway private DNS notes:
#   - *.railway.internal is only resolvable via the internal resolver fd12::10.
#   - nginx caches DNS for the worker lifetime, and a service's private IP
#     changes on every redeploy, so we use a variable in proxy_pass to force
#     per-request re-resolution (valid=1s keeps it fresh).
#   - The backend gunicorn binds 0.0.0.0:8000 (IPv4). This environment is
#     dual-stack (created after 2025-10-16), so we force IPv4 resolution
#     (ipv4=on ipv6=off) to match the listener and avoid picking an AAAA the
#     backend isn't listening on.

# --- njs: append `; Partitioned` (CHIPS) to backend Set-Cookie headers so the
# Django session survives the cross-site iframe on work.clickdz.ai. nginx's
# proxy_cookie_flags can set SameSite=None; Secure but NOT Partitioned, which
# Chromium now requires for third-party cookies. See cdz_cookies.js.
js_path "/etc/nginx/njs/";
js_import cdz from cdz_cookies.js;

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;

    # ---- Railway internal DNS resolver (for *.railway.internal) ----
    resolver [fd12::10] ipv4=on ipv6=off valid=1s;
    resolver_timeout 5s;

    # Backend private target. Kept in a variable so nginx re-resolves per request
    # (private IPv6/IPv4 rotates on each backend redeploy).
    set $meet_backend "http://meet-backend-v2.railway.internal:8000";

    # ---- Common proxy headers (shared by all backend locations) ----
    # Host is forwarded as-is (the frontend public host) so Django's
    # build_absolute_uri() produces first-party redirect_uris on this origin.
    # X-Forwarded-Proto=https is required: backend has
    # SECURE_PROXY_SSL_HEADER=("HTTP_X_FORWARDED_PROTO","https") and
    # SECURE_SSL_REDIRECT=True; without it Django 301-loops to https.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 90s;
    proxy_connect_timeout 30s;

    # ZOOM+ runs in a CROSS-SITE <iframe> on work.clickdz.ai, so Django's session
    # + csrf cookies (default SameSite=Lax) are dropped by the browser as
    # third-party — the SPA's /users/me then 401s and the app shows a Login
    # screen even after a successful OIDC round-trip. Force SameSite=None; Secure
    # on every cookie the backend sets so it survives the iframe (mirrors the
    # app-shim cookie rewrite that fixed Postiz/SlidePro auth).
    proxy_cookie_flags ~ secure samesite=none;

    # ---- API: real backend JSON + OIDC session legs (first-party) ----
    location /api/ {
        proxy_hide_header X-Frame-Options;
        js_header_filter cdz.partitionCookies;
        proxy_pass $meet_backend;
    }

    # Django admin/static and DRF browsable API assets live under /static/ on the
    # backend; proxy them too so the admin and any backend-rendered pages work.
    location /static/ {
        proxy_hide_header X-Frame-Options;
        js_header_filter cdz.partitionCookies;
        proxy_pass $meet_backend;
    }

    # ---- Media (uploaded assets, avatars, recordings download proxy) ----
    location /media/ {
        proxy_hide_header X-Frame-Options;
        js_header_filter cdz.partitionCookies;
        proxy_pass $meet_backend;
    }

    # Upstream Meet exposes an nginx-protected media endpoint used by the
    # recording/download flow (see upstream default.conf `/media-auth` /
    # reset-media references). Proxy it to the backend as well.
    location /reset-media/ {
        proxy_hide_header X-Frame-Options;
        js_header_filter cdz.partitionCookies;
        proxy_pass $meet_backend;
    }

    # ---- Static SPA assets with long cache ----
    location ~* ^/assets/.*\.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- SPA fallback (must stay LAST) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    error_page 404 =200 /index.html;
}
