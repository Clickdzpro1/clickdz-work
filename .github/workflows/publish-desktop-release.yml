name: Publish ClickDz Work desktop release

# Publishes the artifacts of the most recent SUCCESSFUL desktop build as a
# GitHub Release, which automatically lights up the download buttons on the
# ClickDz Work hub (it reads releases/latest client-side) AND feeds the
# desktop auto-updater (the server proxies these releases at /api/releases;
# the updater needs the versioned artifact names + the latest.yml manifest
# generated below).
# Trigger: push a tag like `publish-0.27.1-clickdz.1` (or run manually).

on:
  push:
    tags:
      - 'publish-*'
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Desktop build run id (blank = latest successful)'
        default: ''
        type: string
      release-tag:
        description: 'Release tag to create (blank = current ref name)'
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Locate desktop build run
        id: loc
        uses: actions/github-script@v7
        with:
          script: |
            const manual = `${{ inputs.run-id || '' }}`.trim();
            if (manual) { core.setOutput('run_id', manual); return; }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'build-clickdz-desktop.yml',
              status: 'success', per_page: 1 });
            if (!runs.data.workflow_runs.length)
              core.setFailed('no successful desktop build runs found');
            else {
              core.setOutput('run_id', String(runs.data.workflow_runs[0].id));
              core.info('using run ' + runs.data.workflow_runs[0].id);
            }

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.loc.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Collect installers
        run: |
          echo "--- all artifact files ---"
          find dist -type f | sed 's/^/  /'
          mkdir -p out
          # real installers are >20MB; small zips are onboarding fragments
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.appimage' -o -name '*.deb' \
            -o -name '*.flatpak' -o -name '*.nupkg' \) -size +20M -exec cp -n {} out/ \;
          # Squirrel update index (tiny, required by the Windows updater)
          find dist -type f -name 'RELEASES' -exec cp -n {} out/ \;
          cd out
          if [ -f archive.zip ]; then
            mv archive.zip ClickDzWork-windows-x64-portable.zip
          fi
          # Versionless copies give the hub stable permalinks; the versioned
          # originals stay for the auto-updater (its parser reads
          # ClickDzWork-<ver>[-<suffix>]-<channel>-<platform>-<arch>.<ext>).
          for f in ClickDzWork-*; do
            n=$(echo "$f" | sed -E 's/^ClickDzWork-[0-9][^-]*(-(canary|beta)\.[0-9]+)?-(stable|beta|canary|internal)-/ClickDzWork-/')
            if [ "$f" != "$n" ]; then cp -n "$f" "$n" || true; fi
          done
          echo "--- release payload ---"
          ls -la

      - name: Generate updater manifest (latest.yml)
        run: |
          cd out
          # updatable artifacts, versioned names only (parser needs them)
          mapfile -t files < <(ls ClickDzWork-[0-9]*-windows-*.exe \
            ClickDzWork-[0-9]*-macos-*.zip \
            ClickDzWork-[0-9]*-linux-*.appimage 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no updatable artifacts found — skipping latest.yml"
            exit 0
          fi
          # prefer the windows installer as the primary path
          primary=""
          for f in "${files[@]}"; do
            case "$f" in *.exe) primary="$f"; break;; esac
          done
          [ -z "$primary" ] && primary="${files[0]}"
          version=$(echo "$primary" | cut -d- -f2)
          {
            echo "version: $version"
            echo "files:"
            for f in "${files[@]}"; do
              sha=$(openssl dgst -sha512 -binary "$f" | base64 -w0)
              size=$(stat -c%s "$f")
              echo "  - url: $f"
              echo "    sha512: $sha"
              echo "    size: $size"
            done
            echo "path: $primary"
            echo "sha512: $(openssl dgst -sha512 -binary "$primary" | base64 -w0)"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
          } > latest.yml
          echo "--- latest.yml ---"
          cat latest.yml

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag || github.ref_name }}
          name: ClickDz Work ${{ inputs.release-tag || github.ref_name }}
          files: out/*
          prerelease: false
          body: |
            ClickDz Work — the all-in-one AI workspace by clickdz.ai.

            Unsigned first-generation builds:
            - **Windows**: run `ClickDzWork-windows-x64.exe` (Squirrel installer) or unzip the portable build; SmartScreen may warn — choose "Run anyway".
            - **macOS**: open the DMG; on first launch right-click the app → Open.
            - **Linux**: AppImage (`chmod +x`) or deb.

            Built from the open-source ClickDz Work project (MIT/MPL) — see BRANDING.md.
