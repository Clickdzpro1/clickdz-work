name: Patch Meet images (fix malformed upstream User field)

# The upstream La Suite Meet images carry a malformed container User field
# ("1001:127:-1000" — three components; a container runtime expects uid or
# uid:gid). Railway rejects CREATE_CONTAINER, so the services never start.
# This rebuilds them FROM the mirrored ghcr images with a valid USER 1001.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  patch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: meet-frontend, version: v1.21.0 }
          - { name: meet-backend, version: v1.9.0 }
    steps:
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build patched image
        run: |
          cat > Dockerfile <<'DOCKEREOF'
          FROM ghcr.io/clickdzpro1/${{ matrix.name }}:${{ matrix.version }}
          USER 1001
          DOCKEREOF
          docker build -t ghcr.io/clickdzpro1/${{ matrix.name }}-patched:${{ matrix.version }} .

      - name: Push patched image
        run: docker push ghcr.io/clickdzpro1/${{ matrix.name }}-patched:${{ matrix.version }}

  # ---------------------------------------------------------------------------
  # Frontend PROXY variant.
  #
  # The upstream frontend image is a pure SPA nginx server (try_files -> index.html,
  # 404 => 200 /index.html, NO /api location). Because VITE_API_BASE_URL was empty
  # at build time, the SPA resolves its API base to window.location.origin, so it
  # calls <frontend-origin>/api/v1.0/config/ — which the SPA server answers with
  # index.html (200 text/html). The fetch wrapper treats that non-JSON 200 as
  # `undefined` (staleTime: Infinity, no retry) => infinite "Loading…".
  #
  # Fix: ship a patched nginx conf that proxies /api, /media, /reset-media, /static
  # to the backend over Railway private networking, hiding X-Frame-Options (the app
  # is iframed on work.clickdz.ai). This makes the app effectively single-origin
  # (how upstream Meet deploys), so config fetch returns real JSON AND the OIDC
  # callback lands first-party on the frontend origin.
  #
  # New tag only: v1.21.0-proxy. The plain v1.21.0 tag and the backend image are
  # left untouched for rollback safety.
  # ---------------------------------------------------------------------------
  patch-frontend-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the nginx conf)
        uses: actions/checkout@v4

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build patched frontend image (with API proxy)
        run: |
          cat > Dockerfile.proxy <<'DOCKEREOF'
          FROM ghcr.io/clickdzpro1/meet-frontend:v1.21.0
          # Overwrite the upstream SPA-only conf with our proxy-enabled one.
          # Root is needed to write into /etc/nginx/conf.d; drop back to 1001 after.
          USER root
          COPY .github/meet-proxy/default.conf /etc/nginx/conf.d/default.conf
          RUN chmod 0644 /etc/nginx/conf.d/default.conf
          # Fail the build early if the nginx config is syntactically invalid.
          # `nginx -t` only parses config; it does not resolve DNS or dial the
          # upstream, so the Railway-internal resolver/proxy_pass are fine here.
          RUN nginx -t
          # Same USER fix as the plain patched image (upstream ships a malformed
          # "1001:127:-1000" User field that Railway's runtime rejects).
          USER 1001
          DOCKEREOF
          docker build -f Dockerfile.proxy -t ghcr.io/clickdzpro1/meet-frontend-patched:v1.21.0-proxy .

      - name: Push patched frontend image (proxy)
        run: docker push ghcr.io/clickdzpro1/meet-frontend-patched:v1.21.0-proxy
